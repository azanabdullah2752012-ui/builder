    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pickle-corp-torch.svg" />
    <link rel="alternate icon" type="image/png" href="/pickle-corp-torch.png" />
    <link rel="apple-touch-icon" href="/pickle-corp-torch.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickle Studio — No AI. No Code. No Slop. Web Design & Publishing | Pickle Corp™</title>
    <meta name="description" content="Pickle Studio is the No-AI, No-Code visual web design and 1-click publishing platform by Pickle Corp™. Pure human taste, zero AI slop, zero runtime bloat." />
    <meta property="og:image" content="/pickle-corp-logo.png" />
    <meta property="og:title" content="Pickle Studio — By Pickle Corp™" />
    <meta property="og:description" content="No AI. No Code. No Slop. Handcrafted visual design & 1-click publishing by Pickle Corp™." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Pickle Corp Brand Display & Editorial Typography -->
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isLocal && !document.querySelector('link[href*="app.css"]')) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.crossOrigin = 'anonymous';
          link.href = './assets/app.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/app.js';
          document.head.appendChild(script);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
