<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickle Studio</title>
    <script>
      // GitHub Pages SPA redirect
      // Preserves search params and redirects to the /builder/ app root
      (function () {
        var origin = window.location.origin;
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // If not already under /builder, redirect into /builder/
        if (!pathname.startsWith('/builder')) {
          window.location.replace(origin + '/builder/' + search + hash);
        } else {
          // If already under /builder, forward parameters to /builder/
          window.location.replace(origin + '/builder/' + search + hash);
        }
      })();
    </script>
  </head>
  <body style="background-color: #090a0f; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <div style="margin-bottom: 16px;">
        <img src="./pickle-corp-torch.svg" alt="Pickle Corp Torch" style="width: 44px; height: 44px; display: inline-block;" />
      </div>
      <h2 style="font-size: 22px; margin-bottom: 8px; font-weight: 700;">Loading Pickle Studio...</h2>
      <p style="color: #94a3b8; font-size: 14px;">Redirecting you to the live website...</p>
    </div>
  </body>
</html>
